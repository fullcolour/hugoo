disableAliases = true
staticDir = ["static"]
baseURL = "/"
title = "SUN"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
theme = "PaperMod"

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"

[markup]
  [markup.highlight]
    noClasses = false
    style = "dracula"
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true

  [params.homeInfoParams]
    Content = "欢迎来到我的技术与生活博客。"
 
[params.footer]
  text = "Powered by SUN"

